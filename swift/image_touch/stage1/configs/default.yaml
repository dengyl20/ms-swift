seed: 42

data:
  synth:
    out_path: "data/synth_paired.npz"
    num_samples: 5000
    val_split: 0.1
    max_text_len: 128
    min_text_len: 5
    d_true: 256
    noise_std_text: 0.05
    noise_std_point: 0.05

model:
  d_text_in: 2048
  d_point_in: 256
  point_tokens: 512
  max_text_len: 128

  d_model: 512
  num_latents: 32

  resampler_depth: 2
  decoder_depth: 6

  heads: 8
  ff_mult: 4
  dropout: 0.1

  use_point_pos_emb: true
  use_text_pos_emb: true

loss:
  w_text_recon: 1.0
  w_point2text_recon: 1.0
  w_align: 0.1

  recon_mse: 1.0
  recon_cos: 0.1
  align_type: "cosine"   # "cosine" or "mse"

train:
  batch_size: 32
  num_workers: 4
  epochs: 30

  lr: 0.0002
  weight_decay: 0.05
  betas: [0.9, 0.95]
  grad_clip: 1.0

  amp: true
  log_every: 50

  save_dir: "checkpoints/unified_ae"

  scheduler:
    type: "cosine"
    warmup_steps: 500
